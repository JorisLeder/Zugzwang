# Supabase CLI configuration – only what differs from the CLI defaults. Setup of a hosted project: README.md,
# section "Cloud-Sync einrichten (Supabase)". Auth settings here apply to the local stack (`supabase start`) only;
# for the hosted project they are made in the dashboard.
project_id = "zugzwang"

[db.seed]
enabled = true
# Generated by `npm run supabase:seed-content` (not in git).
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
